# Bravado Payroll - reverse proxy / static server.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream backend { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/company/ {
        alias /srv/media/company/;
        expires 7d;
    }

    location /media/ { return 404; }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        # Restrict the Django admin to internal networks; adjust to your office/VPN range.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Only the company logo is public media. Contract documents are served by the API with authorisation.
    location /media/company/ {
        alias /srv/media/company/;
        expires 7d;
    }
    location /media/ { return 404; }

    location /assets/ {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params.conf;
    }
}
