components:
  schemas:
    ActionEnum:
      enum:
      - LOGIN
      - LOGIN_FAILED
      - LOGOUT
      - PASSWORD_RESET
      - PASSWORD_CHANGE
      - CREATE
      - UPDATE
      - DELETE
      - PAYROLL_CALCULATE
      - PAYROLL_STATUS
      - PAYROLL_APPROVE
      - PAYROLL_CLOSE
      - PAYSLIP_GENERATE
      - PAYMENT_RECORD
      - PERMISSION_CHANGE
      - EXPORT
      type: string
      description: |-
        * `LOGIN` - Login
        * `LOGIN_FAILED` - Login Failed
        * `LOGOUT` - Logout
        * `PASSWORD_RESET` - Password Reset
        * `PASSWORD_CHANGE` - Password Change
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `PAYROLL_CALCULATE` - Payroll Calculate
        * `PAYROLL_STATUS` - Payroll Status
        * `PAYROLL_APPROVE` - Payroll Approve
        * `PAYROLL_CLOSE` - Payroll Close
        * `PAYSLIP_GENERATE` - Payslip Generate
        * `PAYMENT_RECORD` - Payment Record
        * `PERMISSION_CHANGE` - Permission Change
        * `EXPORT` - Export
    AllowanceType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 120
        description:
          type: string
        category:
          $ref: '#/components/schemas/AllowanceTypeCategoryEnum'
        calculation_type:
          $ref: '#/components/schemas/AllowanceTypeCalculationTypeEnum'
        default_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        default_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          description: Percent (e.g. 10 = 10%) or rate per unit
        is_taxable:
          type: boolean
          description: Included in taxable income for PAYE.
        is_social_security_base:
          type: boolean
          description: Included in the base for social-security contributions (e.g.
            NSSF).
        is_cash_emolument:
          type: boolean
          description: Counts as gross cash emolument for employer levies (e.g. SDL/WCF).
        is_recurring:
          type: boolean
        prorate:
          type: boolean
          description: Pro-rate recurring amounts when the employee joins/leaves mid-period.
        is_active:
          type: boolean
        treatment_reference:
          type: string
          description: Legal/regulatory basis for the tax treatment chosen.
          maxLength: 255
      required:
      - code
      - created_at
      - id
      - is_social_security_base
      - is_taxable
      - name
      - updated_at
    AllowanceTypeCalculationTypeEnum:
      enum:
      - FIXED
      - PERCENT_OF_BASIC
      - HOURS_X_RATE
      type: string
      description: |-
        * `FIXED` - Fixed amount
        * `PERCENT_OF_BASIC` - Percentage of basic salary
        * `HOURS_X_RATE` - Quantity x rate (e.g. overtime hours)
    AllowanceTypeCategoryEnum:
      enum:
      - ALLOWANCE
      - OVERTIME
      - BONUS
      - COMMISSION
      - OTHER
      type: string
      description: |-
        * `ALLOWANCE` - Allowance
        * `OVERTIME` - Overtime
        * `BONUS` - Bonus
        * `COMMISSION` - Commission
        * `OTHER` - Other earning
    AllowanceTypeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        category:
          $ref: '#/components/schemas/AllowanceTypeCategoryEnum'
        calculation_type:
          $ref: '#/components/schemas/AllowanceTypeCalculationTypeEnum'
        default_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        default_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          description: Percent (e.g. 10 = 10%) or rate per unit
        is_taxable:
          type: boolean
          description: Included in taxable income for PAYE.
        is_social_security_base:
          type: boolean
          description: Included in the base for social-security contributions (e.g.
            NSSF).
        is_cash_emolument:
          type: boolean
          description: Counts as gross cash emolument for employer levies (e.g. SDL/WCF).
        is_recurring:
          type: boolean
        prorate:
          type: boolean
          description: Pro-rate recurring amounts when the employee joins/leaves mid-period.
        is_active:
          type: boolean
        treatment_reference:
          type: string
          description: Legal/regulatory basis for the tax treatment chosen.
          maxLength: 255
      required:
      - code
      - is_social_security_base
      - is_taxable
      - name
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        username:
          type: string
          maxLength: 150
        action:
          $ref: '#/components/schemas/ActionEnum'
        model:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 64
        object_repr:
          type: string
          maxLength: 255
        old_values:
          nullable: true
        new_values:
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 255
        message:
          type: string
        user:
          type: integer
          nullable: true
      required:
      - action
      - id
      - timestamp
    BankExportFormat:
      type: object
      description: Run the model's clean() during serializer validation so business
        rules live in one place.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        delimiter:
          type: string
          maxLength: 2
        include_header:
          type: boolean
        columns:
          description: 'Ordered list of {"header": "...", "field": "<available field>"}
            or {"header": "...", "value": "<constant>"}'
        date_format:
          type: string
          maxLength: 20
        amount_decimals:
          type: integer
          maximum: 32767
          minimum: 0
        narration_template:
          type: string
          maxLength: 140
        payment_method:
          type: string
