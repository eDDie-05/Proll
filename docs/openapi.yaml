openapi: 3.0.3
info:
  title: Bravado Company Ltd Payroll API
  version: 1.0.0
  description: REST API for the Bravado Company Ltd Payroll Management System.
paths:
  /api/allowance-types/:
    get:
      operationId: allowance_types_list
      description: ModelViewSet that records create/update/delete in the audit log
        with before/after values.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ALLOWANCE
          - BONUS
          - COMMISSION
          - OTHER
          - OVERTIME
        description: |-
          * `ALLOWANCE` - Allowance
          * `OVERTIME` - Overtime
          * `BONUS` - Bonus
          * `COMMISSION` - Commission
          * `OTHER` - Other earning
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_taxable
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - allowance-types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllowanceType'
          description: ''
    post:
      operationId: allowance_types_create
      description: ModelViewSet that records create/update/delete in the audit log
        with before/after values.
      tags:
      - allowance-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowanceTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllowanceTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllowanceTypeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceType'
          description: ''
  /api/allowance-types/{id}/:
    get:
      operationId: allowance_types_retrieve
      description: ModelViewSet that records create/update/delete in the audit log
        with before/after values.
      parameters:
      - in: path
