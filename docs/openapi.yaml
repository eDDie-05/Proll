          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceType'
          description: ''
    delete:
      operationId: allowance_types_destroy
      description: ModelViewSet that records create/update/delete in the audit log
        with before/after values.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this allowance type.
        required: true
      tags:
      - allowance-types
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Read-only. There is intentionally no create/update/delete endpoint
        for audit records.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CREATE
          - DELETE
          - EXPORT
          - LOGIN
          - LOGIN_FAILED
          - LOGOUT
          - PASSWORD_CHANGE
          - PASSWORD_RESET
          - PAYMENT_RECORD
          - PAYROLL_APPROVE
          - PAYROLL_CALCULATE
          - PAYROLL_CLOSE
          - PAYROLL_STATUS
          - PAYSLIP_GENERATE
          - PERMISSION_CHANGE
          - UPDATE
        description: |-
          * `LOGIN` - Login
          * `LOGIN_FAILED` - Login Failed
          * `LOGOUT` - Logout
          * `PASSWORD_RESET` - Password Reset
          * `PASSWORD_CHANGE` - Password Change
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `PAYROLL_CALCULATE` - Payroll Calculate
          * `PAYROLL_STATUS` - Payroll Status
          * `PAYROLL_APPROVE` - Payroll Approve
          * `PAYROLL_CLOSE` - Payroll Close
          * `PAYSLIP_GENERATE` - Payslip Generate
          * `PAYMENT_RECORD` - Payment Record
          * `PERMISSION_CHANGE` - Permission Change
          * `EXPORT` - Export
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Read-only. There is intentionally no create/update/delete endpoint
