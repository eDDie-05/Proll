      required:
      - columns
      - name
    BaseEnum:
      enum:
      - BASIC
      - GROSS
      - SOCIAL_SECURITY_BASE
      - TAXABLE_INCOME
      - CASH_EMOLUMENTS
      type: string
      description: |-
        * `BASIC` - Basic salary (after proration/unpaid leave)
        * `GROSS` - Gross earnings
        * `SOCIAL_SECURITY_BASE` - Earnings flagged for social security
        * `TAXABLE_INCOME` - Taxable income (taxable earnings less pre-tax deductions)
        * `CASH_EMOLUMENTS` - Gross cash emoluments
