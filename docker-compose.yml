# Bravado Company Ltd - Payroll Management System
# Usage: cp .env.example .env && docker compose up --pull always -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  backend:
    build: { context: ., dockerfile: docker/backend/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},backend
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  frontend:
    build: { context: ., dockerfile: docker/frontend/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ${TLS_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  backup:
    build: { context: ., dockerfile: docker/backup/Dockerfile }
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-Africa/Dar_es_Salaam}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REMOTE_RETENTION_DAYS: ${BACKUP_REMOTE_RETENTION_DAYS:-90}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${RCLONE_CONFIG_DIR:-./docker/backup/rclone}:/config/rclone:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_www:

networks:
  internal:
